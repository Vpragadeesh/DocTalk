services:
  - type: web
    name: doctalk-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    workingDir: server
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: DOCTALK
      - key: MONGODB_TLS_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: DEEP_SEARCH_ENABLED
        value: "true"
      - key: DEEP_SEARCH_DEPTH
        value: moderate
      - key: DEEP_SEARCH_MAX_CONTEXT
        value: "30000"
      - key: DEEP_SEARCH_TIMEOUT
        value: "30"
      - key: DEEP_SEARCH_CACHE_TTL
        value: "3600"
      - key: REASONING_MODEL
        value: claude-sonnet-4-20250514
      - key: REASONING_TEMPERATURE
        value: "0.3"
      - key: REASONING_MAX_STEPS
        value: "5"
      - key: KNOWLEDGE_GRAPH_ENABLED
        value: "true"
      - key: KG_CONCEPT_THRESHOLD
        value: "0.7"
      - key: DEEP_SEARCH_CACHE_ENABLED
        value: "true"
      - key: DEEP_SEARCH_CACHE_STRATEGY
        value: lru
      - key: PARALLEL_REASONING
        value: "true"
      - key: STREAMING_ENABLED
        value: "true"
      - key: PERPLEXICA_API_URL
        value: http://localhost:3001
      - key: PERPLEXICA_ENABLED
        value: "true"
      - key: PERPLEXICA_TIMEOUT
        value: "30"
      - key: PERPLEXICA_AUTO_THRESHOLD
        value: "0.6"
      - key: PERPLEXICA_CACHE_TTL
        value: "1800"
      - key: PERPLEXICA_MAX_RESULTS
        value: "10"
      - key: PERPLEXICA_DEFAULT_FOCUS
        value: webSearch